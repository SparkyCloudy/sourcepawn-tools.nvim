name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: JohnnyMorganz/stylua-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: latest
          args: --check lua/ tests/

  build-test:
    name: Test (Neovim ${{ matrix.neovim }} / ${{ matrix.os }})
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        neovim: [v0.11.0, stable]
        exclude:
          - os: windows-latest
            neovim: v0.11.0
          - os: macos-latest
            neovim: v0.11.0
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Neovim
        uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: ${{ matrix.neovim }}

      - name: Install plenary.nvim (Linux / macOS)
        if: runner.os != 'Windows'
        run: |
          mkdir -p ~/.local/share/nvim/site/pack/test/start
          git clone --depth 1 https://github.com/nvim-lua/plenary.nvim \
            ~/.local/share/nvim/site/pack/test/start/plenary.nvim

      - name: Install plenary.nvim (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $dir = "$env:LOCALAPPDATA\nvim-data\site\pack\test\start"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          git clone --depth 1 https://github.com/nvim-lua/plenary.nvim "$dir\plenary.nvim"

      - name: Run tests (Linux / macOS)
        if: runner.os != 'Windows'
        run: |
          nvim --headless -u tests/minimal_init.lua \
            -c "PlenaryBustedDirectory tests/sourcepawn-tools {minimal_init = 'tests/minimal_init.lua', sequential = true}" \
            -c "qa"

      - name: Run tests (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          nvim --headless -u tests/minimal_init.lua `
            -c "PlenaryBustedDirectory tests/sourcepawn-tools {minimal_init = 'tests/minimal_init.lua', sequential = true}" `
            -c "qa"
